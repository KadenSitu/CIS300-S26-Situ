<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact form for fitness questions and beginner guidance.">
    <title>Contact | Kaden’s Fitness Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Kaden’s Fitness Hub</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="workouts.html">Workouts</a></li>
            <li><a href="healthyhabits.html">Healthy Habits</a></li>
            <li><a href="motivation.html">Motivation</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <h2>Contact Me</h2>
        <p>If you have questions or want beginner fitness guidance, fill out the form below and I’ll get back to you.</p>

        <form action="#">
            <label for="name">Name:</label>
            <input type="text" id="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="experience">Fitness Experience:</label>
            <select id="experience">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" rows="5" required></textarea>

            <button type="submit">Submit</button>
        </form>

        <img src="images/contact.jpg" alt="Contact illustration" class="page-image">

    </main>

    <footer>
        <p>© 2026 Kaden’s Fitness Hub | <a href="#">Email Me</a></p>
    </footer>
</body>
</html>
